
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>画像一括変換</title>
</head>
<body>

<h1>画像一括変換</h1>

<p>画像をまとめて選択してください。</p>
<input type="file" id="files" accept="image/*" multiple>

<button id="convert">まとめて縮小</button>
<p id="status"></p>

<script>
const MAX_SIZE = 1200;
const QUALITY = 0.8;

document.getElementById("convert").addEventListener(
  "click", async () => {

  const files = [...document.getElementById("files").files];
  const status = document.getElementById("status");

  if (files.length === 0) {
    status.textContent = "画像を選択してください。";
    return;
  }

  if (!window.showDirectoryPicker) {
    status.textContent = "Chromeなどの対応ブラウザで開いてください。";
    return;
  }

  try {
    const folder = await window.showDirectoryPicker({
      mode: "readwrite"
    });

    for (let i = 0; i < files.length; i++) {
      const bitmap = await createImageBitmap(files[i]);

      const scale = Math.min(
        1,
        MAX_SIZE / Math.max(bitmap.width, bitmap.height)
      );

      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(bitmap.width * scale));
      canvas.height = Math.max(1, Math.round(bitmap.height * scale));

      canvas.getContext("2d").drawImage(
        bitmap, 0, 0, canvas.width, canvas.height
      );
      bitmap.close();

      const blob = await new Promise(resolve =>
        canvas.toBlob(resolve, "image/webp", QUALITY)
      );

      if (!blob || blob.type !== "image/webp") {
        throw new Error("WebP変換に失敗しました");
      }

      const name = files[i].name.replace(/\.[^.]+$/, "") + ".webp";
      const handle = await folder.getFileHandle(name, {
        create: true
      });

      const writer = await handle.createWritable();
      await writer.write(blob);
      await writer.close();

      status.textContent =
        `${i + 1} / ${files.length} 枚変換しました`;
    }

    status.textContent = "すべて変換できました。";

  } catch (error) {
    status.textContent = "中断しました: " + error.message;
  }
});
</script>

</body>
</html>
