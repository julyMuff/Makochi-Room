<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ふちをたどれ！</title>
  <link rel="stylesheet" href="style.css">
  <script src="outline-data.js" defer></script>
  <script src="game.js" defer></script>
</head>
  <script type="module" src="counter.js"></script>
<body>
  <main class="game">
    <header class="heading">
      <span class="eyebrow">MINI GAME / 001</span>
      <h1>ふちをたどれ！</h1>
      <p class="instructions">STARTから、光る線の上をたどってGOALへ。<br>線を外れると失敗。PCはマウス、スマホは指で操作。</p>
    </header>

    <div class="game-panel">
      <div class="panel-top">
        <span id="status" role="status" aria-live="polite">READY</span>
        <span id="progress">0%</span>
        <span id="clear-counter">TOTAL CLEARS: ---</span>
      </div>
      <canvas id="game" width="576" height="576" aria-label="輪郭をなぞるゲーム。緑のSTARTから光る線をたどってGOALへ。">ゲームの表示にはCanvas対応ブラウザが必要です。</canvas>
      <div class="panel-bottom">
        <span id="hint">緑のSTARTを押して始めよう。</span>
        <button id="reset" type="button">やりなおす</button>
      </div>
    </div>
    <p class="notice">※ 突然、画像が大きく表示される演出があります。</p>
  </main>

  <!-- 失敗時は画面全面に2枚目の画像を表示 -->
  <div id="surprise" class="surprise" role="dialog" aria-modal="true" aria-label="ゲームオーバー" hidden>
    <img src="surprise.png" alt="ゲームオーバー画像" draggable="false">
    <button id="retry" type="button">もう一度</button>
  </div>
  <script>
    // 画像が読めなかった場合の表示のための簡単なフォールバックは game.js にあります。
  </script>
</body>
</html>
